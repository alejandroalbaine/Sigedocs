services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:5173:5173'
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  frontend_node_modules:
